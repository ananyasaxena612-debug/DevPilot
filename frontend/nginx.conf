server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend API requests
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /install.sh {
        proxy_pass http://backend:5000/install.sh;
        proxy_set_header Host $host;
    }

    location /agent/ {
        proxy_pass http://backend:5000/agent/;
        proxy_set_header Host $host;
    }

    location /monitor/ {
        proxy_pass http://backend:5000/monitor/;
        proxy_set_header Host $host;
    }

    location /status {
        proxy_pass http://backend:5000/status;
        proxy_set_header Host $host;
    }

    location /analyze {
        proxy_pass http://backend:5000/analyze;
        proxy_set_header Host $host;
    }

    location /download-report {
        proxy_pass http://backend:5000/download-report;
        proxy_set_header Host $host;
    }
}

